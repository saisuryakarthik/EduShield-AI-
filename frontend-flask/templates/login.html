<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="EduShield AI — Secure identity and phone number change management."
    >

    <title>EduShield AI — Secure Access</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<main class="login-container">

    <section
        class="login-card"
        aria-labelledby="login-title"
    >

        <!-- Brand -->
        <header>

            <p
                style="
                    margin: 0 0 18px;
                    color: var(--accent-light);
                    font-family: var(--font-display);
                    font-size: 0.72rem;
                    font-weight: 700;
                    letter-spacing: 0.16em;
                    text-transform: uppercase;
                "
            >
                EduShield / Identity Security
            </p>

            <h1 id="login-title">
                Welcome back.
            </h1>

            <p class="subtitle">
                Secure access to the EduShield phone-change protection system.
            </p>

        </header>


        <!-- Backend error -->
        {% if error %}

            <div
                class="error-message"
                role="alert"
                aria-live="polite"
            >
                {{ error }}
            </div>

        {% endif %}


        <!-- Login -->
        <form
            method="POST"
            class="login-form"
            id="login-form"
        >

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@univ.edu"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Login -->
            <button
                type="submit"
                class="btn-primary"
                id="login-btn"
            >
                Continue securely
            </button>

        </form>

        <p
            style="
                margin-top: 16px;
                text-align: center;
                font-size: 0.8rem;
            "
        >
            First time here?
            <a href="/activate">Activate your account</a>
        </p>


        <!-- Security footer -->
        <footer
            style="
                margin-top: 24px;
                text-align: center;
                color: var(--text-muted);
                font-size: 0.68rem;
                line-height: 1.5;
            "
        >
            Secure authentication · EduShield AI
        </footer>

    </section>

</main>


<script>

    /*
     * The login form submits email and password to the backend.
     * No browser location is required.
     */

    const form =
        document.getElementById("login-form");

    form.addEventListener(
        "submit",
        function(event) {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                event.preventDefault();

                alert(
                    "Email and password are required."
                );
            }
        }
    );

</script>

</body>
</html>
